<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Riyadh Canopy — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    /* Matches the official Green Riyadh TMO dashboard: white surface, dark
       green brand bars/accents, black body text -- always on, not tied to
       the visitor's OS light/dark preference (the official dashboard has no
       dark mode, so neither does this page anymore). */
    color-scheme: light;
    --surface-1:      #ffffff;
    --page-plane:     #f2f4f2;
    --text-primary:   #0b0b0b;
    --text-secondary: #45463f;
    --text-muted:     #767a70;
    --gridline:       #e2e5e0;
    --baseline:       #cdd1c9;
    --border:         rgba(11,11,11,0.10);
    --card-shadow:    0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.05);

    --cat-road:       #2a78d6;
    --cat-wadi:       #eb6834;
    --cat-park:       #1baf7a;
    --cat-violet:     #4a3aa7;
    --brand-green:    #22763C;
    --value-green:    #1f8a44;

    --seq-300:        #7bc99a;
    --seq-450:        #2e9e5b;
    --seq-600:        #1a5c34;

    --success:        #1f8a44;
    --status-good:     #0ca30c;
    --status-warning:  #d98c00;
    --status-critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; overflow-x: hidden; }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }

  /* Header */
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  header.top h1 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; margin: 0 0 6px; letter-spacing: -0.02em; }
  header.top p.sub { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .status-line { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); flex: none; }
  .dot.loading { background: var(--cat-wadi); animation: pulse 1.1s ease-in-out infinite; }
  .dot.error { background: var(--status-critical); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  button.refresh {
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 8px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s;
  }
  button.refresh:hover { background: var(--gridline); }
  button.refresh svg { width: 14px; height: 14px; }

  /* Stat tiles */
  .stat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 40px; align-items: stretch; }
  @media (max-width: 900px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-top: 3px solid var(--tile-accent, var(--gridline));
    border-radius: 10px 10px 14px 14px; padding: 14px 12px; box-shadow: var(--card-shadow);
    display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: flex-start; gap: 6px;
  }
  .stat-tile:nth-child(1) { --tile-accent: var(--brand-green); }
  .stat-tile:nth-child(2) { --tile-accent: var(--cat-road); }
  .stat-tile:nth-child(3) { --tile-accent: var(--cat-wadi); }
  .stat-tile:nth-child(4) { --tile-accent: var(--cat-park); }
  .stat-tile:nth-child(5) { --tile-accent: var(--cat-violet); }
  .stat-tile:nth-child(6) { --tile-accent: var(--cat-violet); }
  .stat-tile .label {
    font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    white-space: normal; line-height: 1.35; display: flex; align-items: center; justify-content: center; min-height: 4.1em;
  }
  .stat-tile .value { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: var(--value-green); }
  .stat-tile .value small { font-size: 14px; font-weight: 500; color: var(--text-secondary); }

  /* Total Projects tile: split into 2 equally-labeled parts (overall total | Review & Completed subset) */
  .stat-split { display: flex; align-items: flex-start; justify-content: center; gap: 12px; width: 100%; }
  .stat-split-divider { width: 1px; align-self: stretch; background: var(--border); }
  .stat-split-part { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .stat-split-value2 { font-size: 22px; }
  .stat-split-label {
    font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
    line-height: 1.3; display: flex; align-items: center; justify-content: center; min-height: 4.1em;
  }

  /* Insights: 2 donut cards side by side (Current Trees | Total Potential Trees) */
  .insight-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 32px; }
  @media (max-width: 900px) { .insight-row { grid-template-columns: 1fr; } }
  .insight-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--card-shadow); }
  .insight-card.insight-solo { width: 100%; padding: 28px 32px; }
  .insight-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .insight-solo .insight-title { font-size: 13px; text-align: center; }
  .insight-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 400; text-transform: none; letter-spacing: normal; margin-bottom: 18px; }
  .insight-hero-num { font-size: 36px; font-weight: 800; color: var(--brand-green); line-height: 1; margin: 6px 0 3px; letter-spacing: -0.01em; }
  .insight-solo .insight-hero-num { font-size: 46px; text-align: center; }
  .insight-hero-sub { font-size: 12.5px; color: var(--text-secondary); margin-bottom: 18px; }
  .insight-solo .insight-hero-sub { text-align: center; }
  .insight-solo .donut-wrap { justify-content: center; }
  .insight-solo .legend-row { font-size: 14px; }
  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .donut-ring-wrap { position: relative; flex: none; }
  .donut-center-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; width: 100%; }
  /* A single shared grid across ALL rows (not one grid per row) -- .legend-row
     is display:contents so its dot/label/value become direct grid children here,
     which is what makes the value column the same width/left-edge on every row
     regardless of how many digits that row's own number has. */
  .donut-legend { display: grid; grid-template-columns: 10px 1fr auto; row-gap: 11px; column-gap: 8px; flex: 1; min-width: 150px; align-items: center; }
  .legend-row { display: contents; font-size: 12.5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .legend-label { color: var(--text-secondary); }
  .legend-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: baseline; justify-content: flex-start; gap: 3px; }
  .legend-val small { color: var(--text-muted); font-weight: 500; }
  .empty-note { font-size: 12.5px; color: var(--text-muted); }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 28px; position: sticky; top: 0; z-index: 5; background: var(--page-plane); padding: 10px 0; }
  .tabs { display: flex; gap: 6px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
  .tab {
    border: none; background: transparent; color: var(--text-secondary); font-family: inherit;
    font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 7px; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; gap: 7px;
  }
  .tab .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .tab.active { background: var(--gridline); color: var(--text-primary); }
  .search-box { flex: 1; min-width: 180px; max-width: 320px; position: relative; }
  .search-box input {
    width: 100%; font-family: inherit; font-size: 13px; padding: 9px 12px 9px 34px;
    border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  .search-box input:focus { outline: 2px solid var(--cat-road); outline-offset: -1px; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-muted); }

  /* Section -- solid green header bar, matching the official TMO dashboard's
     "Information" panel headers. */
  section.category { margin-bottom: 44px; }
  .cat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; background: var(--brand-green); padding: 10px 16px; border-radius: 8px; flex-wrap: wrap; row-gap: 4px; }
  .cat-badge { width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  .cat-header h2 { font-size: 16px; font-weight: 700; margin: 0; color: #fff; }
  .cat-header .count { font-size: 13px; color: rgba(255,255,255,.8); font-weight: 500; }
  .cat-summary { font-size: 12px; color: #fff; margin-left: auto; text-align: right; }
  .cat-summary-line { display: block; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 18px 16px; box-shadow: var(--card-shadow); transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(11,11,11,0.06), 0 14px 28px rgba(11,11,11,0.09); }
  .card .name { font-size: 14.5px; font-weight: 600; margin-bottom: 2px; line-height: 1.3; }
  .card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .card .meta b { color: var(--text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }

  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; }
  .bar-row .bar-label { font-size: 10px; color: var(--text-muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { position: relative; height: 6px; background: var(--gridline); border-radius: 4px; overflow: visible; }
  .bar-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 4px; transition: width .5s ease; }
  .bar-fill.current { background: var(--seq-300); }
  .bar-fill.mature   { background: var(--seq-450); }
  .bar-fill.future   { background: var(--seq-600); width: 100% !important; opacity: .35; }
  .bar-row .bar-val { font-size: 11.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

  .card .footnote { margin-top: 12px; font-size: 10.5px; color: var(--text-muted); border-top: 1px solid var(--gridline); padding-top: 8px; display: flex; justify-content: space-between; align-items: center; }
  .card .footnote .footnote-val { font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; font-size: 11.5px; }

  /* Coming soon card */
  .coming-soon {
    border: 1.5px dashed var(--border); border-radius: 14px; padding: 22px 24px;
    display: flex; align-items: center; gap: 16px; color: var(--text-secondary);
  }
  .coming-soon .num { font-size: 30px; font-weight: 800; color: var(--text-primary); }
  .coming-soon .txt { font-size: 13px; line-height: 1.5; }
  .coming-soon .txt b { color: var(--text-primary); }

  /* Loading / error */
  .state-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; text-align: center; color: var(--text-secondary); gap: 14px; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--gridline); border-top-color: var(--cat-road); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-panel .err-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .state-panel button.retry {
    border: 1px solid var(--border); background: var(--cat-road); color: #fff; font-family: inherit;
    font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 9px; cursor: pointer;
  }


  .hidden { display: none !important; }

  /* Download = print to PDF. Hide interactive chrome, let content reflow to
     the printed page instead of the sticky/scrolling on-screen layout. */
  @media print {
    button.refresh, .status-line, .controls { display: none !important; }
    body { background: #fff; }
    .wrap { padding: 10px 16px; max-width: none; }
    .card:hover { transform: none; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Canopy Cover Review Overview <span style="font-size:0.42em; font-weight:500; color:var(--text-muted); letter-spacing:normal; white-space:nowrap;">(Under Development by GIS team)</span></h1>
      <p class="sub" id="dataStamp"></p>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
      <div style="display:flex; gap:8px;">
        <button class="refresh" onclick="loadData()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
          Refresh
        </button>
        <button class="refresh" id="downloadBtn" onclick="downloadOverviewPDF()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M5 21h14"></path></svg>
          Download
        </button>
      </div>
      <div class="status-line"><span class="dot loading" id="statusDot"></span><span id="statusText">Loading latest data…</span></div>
    </div>
  </header>

  <div id="loadingPanel" class="state-panel">
    <div class="spinner"></div>
    <div>Fetching latest figures from the tracking sheet…</div>
  </div>

  <div id="errorPanel" class="state-panel hidden">
    <div class="err-title">Couldn't load the data</div>
    <div id="errorDetail" style="font-size:13px;"></div>
    <button class="retry" onclick="loadData()">Try again</button>
  </div>

  <div id="content" class="hidden">

    <div class="stat-row" id="statRow"></div>

    <div class="insight-row" id="insightRow"></div>

    <div class="controls">
      <div class="tabs" id="tabs"></div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search a project name…" oninput="render()">
      </div>
    </div>

    <div id="sections"></div>

  </div>

</div>

<script>
// Direct dl.dropboxusercontent.com URL instead of www.dropbox.com -- this
// serves the file in one hop with Access-Control-Allow-Origin: * (confirmed
// via curl), unlike the www.dropbox.com share link, whose first redirect hop
// has no CORS header and gets blocked by real browsers. Works on any static
// host (GitHub Pages included) with no server-side proxy needed.
const SOURCE_URL = "https://dl.dropboxusercontent.com/scl/fi/mnic6vthj5h3fqbknjqx5/KPI.xlsx?rlkey=4uargirdbzemm5yg893osibqo&dl=1";
const CATEGORY_LABELS = ["Road", "Wadi", "Large Park", "Neighbourhood"];
// Riyadh metropolitan area, used as the denominator for the "city-wide contribution"
// stat tiles -- how much of the WHOLE CITY's area the reviewed projects' canopy covers,
// not just how each project is doing against its own individual target.
const RIYADH_AREA_M2 = 5961.5 * 1e6;
const CAT_COLOR = { "Road": "var(--cat-road)", "Wadi": "var(--cat-wadi)", "Large Park": "var(--cat-park)" };
const CAT_ICON  = { "Road": "🛣️", "Wadi": "🏞️", "Large Park": "🌳" };

let DATA = { Road: [], Wadi: [], "Large Park": [], Neighbourhood: [] };
let activeTab = "All";

function fmt(n, digits) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: digits ?? 0 });
}
function pct(n) { if (n === null || n === undefined || isNaN(n)) return "—"; return Number(n).toFixed(1) + "%"; }

async function loadData() {
  document.getElementById("content").classList.add("hidden");
  document.getElementById("errorPanel").classList.add("hidden");
  document.getElementById("loadingPanel").classList.remove("hidden");
  document.getElementById("statusDot").className = "dot loading";
  document.getElementById("statusText").textContent = "Loading latest data…";
  try {
    const res = await fetch(SOURCE_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("Server responded with " + res.status);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets["Tabelle1"] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    parseRows(rows);
    const stampEl = document.getElementById("dataStamp");
    if (stampEl) {
      const modified = wb.Props && wb.Props.ModifiedDate;
      stampEl.textContent = modified
        ? "Data last updated: " + modified.toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric" }) + " at " + modified.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        : "Data last updated: unknown";
    }
    document.getElementById("loadingPanel").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
    document.getElementById("statusDot").className = "dot";
    const now = new Date();
    document.getElementById("statusText").textContent = "Live — updated " + now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    buildTabs();
    buildStats();
    buildInsights();
    render();
  } catch (err) {
    console.error(err);
    document.getElementById("loadingPanel").classList.add("hidden");
    document.getElementById("errorPanel").classList.remove("hidden");
    document.getElementById("statusDot").className = "dot error";
    document.getElementById("statusText").textContent = "Failed to load";
    document.getElementById("errorDetail").textContent = "Check your internet connection, or that the shared Dropbox link is still valid. (" + err.message + ")";
  }
}

function parseRows(rows) {
  DATA = { Road: [], Wadi: [], "Large Park": [], Neighbourhood: [] };
  let current = null;
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = row[0];
    if (name === null || name === undefined || String(name).trim() === "") continue;
    const label = String(name).trim();
    if (label === "Notes") break;
    if (CATEGORY_LABELS.includes(label)) { current = label; continue; }
    if (!current) continue;
    DATA[current].push({
      name: label,
      area: row[1],           // B - Project area (m2)
      currentTrees: row[3],   // D - Current trees
      totalTrees: row[8],     // I - Total trees
      plannedKPI: row[10],    // K - Planned KPI (%)
      currentKPI: row[11],    // L - Current KPI (%)
      matureKPI: row[12],     // M - Current KPI mature canopy (%)
      futureKPI: row[13],     // N - Potential total future KPI (%)
    });
  }
}

function aggregate(items) {
  const n = items.length || 1;
  const sum = (k) => items.reduce((a, x) => a + (Number(x[k]) || 0), 0);
  const avg = (k) => items.length ? sum(k) / items.filter(x => x[k] !== null && x[k] !== undefined).length || 0 : 0;
  return {
    count: items.length,
    currentTrees: sum("currentTrees"),
    totalTrees: sum("totalTrees"),
    avgCurrentKPI: avg("currentKPI"),
    avgMatureKPI: avg("matureKPI"),
    avgFutureKPI: avg("futureKPI"),
  };
}

// Absolute canopy area contributed by these projects (project's own area * its KPI%,
// summed across all reviewed projects), as a % of the WHOLE CITY's area (RIYADH_AREA_M2)
// -- i.e. how much of Riyadh itself is covered, not how each project is doing against
// its own individual target (that per-project-average version is what this replaced).
function cityWideContribution(items, kpiField) {
  var totalCanopyArea = items.reduce(function(sum, p) {
    var area = Number(p.area) || 0;
    var kpi = Number(p[kpiField]) || 0;
    return sum + (area * kpi / 100);
  }, 0);
  return totalCanopyArea / RIYADH_AREA_M2 * 100;
}

function buildStats() {
  const all = [...DATA.Road, ...DATA.Wadi, ...DATA["Large Park"]];
  const agg = aggregate(all);
  const currentCityPct = cityWideContribution(all, "currentKPI");
  const futureCityPct = cityWideContribution(all, "futureKPI");
  const tiles = [
    // Fixed manual figures for now (not Excel-derived) -- 51 total projects,
    // 18 of which are in Review & Completed status. Update here if/when the
    // source sheet gets a status column to compute this automatically.
    { label: "Total Projects", value: "51", split: { value: "18", label: "Reviewed & Completed" } },
    { label: "Current Trees from Reviewed Projects", value: fmt(agg.currentTrees) },
    { label: "Total Potential Trees From Reviewed Projects", value: fmt(agg.totalTrees - agg.currentTrees) },
    { label: "Total Trees From Reviewed Projects", value: fmt(agg.totalTrees) },
    { label: "Current Canopy Cover Contribution From Reviewed Projects", value: currentCityPct.toFixed(2) + "%" },
    { label: "Future Mature Canopy Cover Contribution From Reviewed Projects", value: futureCityPct.toFixed(2) + "%" },
  ];
  document.getElementById("statRow").innerHTML = tiles.map(t => t.split
    ? `<div class="stat-tile"><div class="stat-split">
         <div class="stat-split-part"><div class="stat-split-label">${t.label}</div><div class="value">${t.value}</div></div>
         <div class="stat-split-divider"></div>
         <div class="stat-split-part"><div class="stat-split-label">${t.split.label}</div><div class="value stat-split-value2">${t.split.value}</div></div>
       </div></div>`
    : `<div class="stat-tile"><div class="label">${t.label}</div><div class="value">${t.value}</div></div>`
  ).join("");
}

// Simple dependency-free donut: a ring built from stacked <circle> stroke-dasharrays,
// rotated -90deg so the first segment starts at 12 o'clock. A 2px stroke-dasharray gap
// is left between segments as a surface break (matches the rest of the page's mark spec).
function donutSVG(segments, size) {
  size = size || 168;
  var r = size / 2 - 15, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
  var total = segments.reduce(function(a, s) { return a + s.value; }, 0) || 1;
  var offset = 0;
  var arcs = segments.map(function(s) {
    var frac = s.value / total;
    var len = frac * circ;
    var gap = segments.length > 1 ? 2 : 0;
    var dash = Math.max(0, len - gap) + ' ' + (circ - len + gap);
    var html = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="18" stroke-dasharray="' + dash + '" stroke-dashoffset="' + (-offset) + '"><title>' + s.label + ': ' + fmt(s.value) + ' (' + (frac * 100).toFixed(1) + '%)</title></circle>';
    offset += len;
    return html;
  }).join('');
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" style="transform:rotate(-90deg);flex:none">' + arcs + '</svg>';
}

function legendListHTML(segments) {
  var total = segments.reduce(function(a, s) { return a + s.value; }, 0) || 1;
  return '<div class="donut-legend">' + segments.map(function(s) {
    return '<div class="legend-row"><span class="legend-dot" style="background:' + s.color + '"></span>' +
      '<span class="legend-label">' + s.label + '</span>' +
      '<span class="legend-val">' + fmt(s.value) + ' <small>(' + (s.value / total * 100).toFixed(1) + '%)</small></span></div>';
  }).join('') + '</div>';
}

// Trees-by-category donut -- computed purely from the same Excel-derived DATA
// used everywhere else on the page. Loops over DATA's own category keys
// (skipping Neighbourhood, which has no numeric figures yet) so a future
// category picks up automatically. Total is rendered INSIDE the ring itself
// (a plain absolutely-positioned div OVER the ring, not an SVG foreignObject --
// html2canvas, used for the PDF export, doesn't reliably reverse the nested
// SVG-space + CSS rotation the foreignObject approach needed, so the center
// number rendered sideways in the exported PDF even though it looked fine
// live in a real browser. A normal HTML overlay avoids that entirely.)
function donutCardHTML(title, subtitle, segs, size) {
  var total = segs.reduce(function(a, s) { return a + s.value; }, 0);
  var centerHTML = '<div style="font-size:30px;font-weight:800;color:var(--brand-green);line-height:1.1">' + fmt(total) + '</div>';
  var ring = segs.length
    ? '<div class="donut-ring-wrap">' + donutSVG(segs, size || 220) + '<div class="donut-center-label">' + centerHTML + '</div></div>'
    : '';
  return '<div class="insight-card insight-solo">' +
      '<div class="insight-title">' + title + '</div>' +
      '<div class="insight-hero-sub">' + subtitle + '</div>' +
      (segs.length ? '<div class="donut-wrap">' + ring + legendListHTML(segs) + '</div>' : '<div class="empty-note">No data yet.</div>') +
    '</div>';
}

function buildInsights() {
  var catKeys = Object.keys(DATA).filter(function(k) { return k !== "Neighbourhood" && DATA[k].length; });

  var currentSegs = catKeys.map(function(k) {
    return { label: k + "s", value: aggregate(DATA[k]).currentTrees, color: CAT_COLOR[k] || "var(--cat-violet)" };
  }).filter(function(s) { return s.value > 0; });

  var potentialSegs = catKeys.map(function(k) {
    var a = aggregate(DATA[k]);
    return { label: k + "s", value: a.totalTrees - a.currentTrees, color: CAT_COLOR[k] || "var(--cat-violet)" };
  }).filter(function(s) { return s.value > 0; });

  document.getElementById("insightRow").innerHTML =
    donutCardHTML("Current Trees in Reviewed Projects", "Citywide tree count by project category", currentSegs) +
    donutCardHTML("Total Potential Trees From Reviewed Projects", "Citywide potential tree count by project category", potentialSegs);
}

function buildTabs() {
  const tabDefs = [
    { key: "All", color: "var(--text-muted)" },
    { key: "Road", color: CAT_COLOR["Road"] },
    { key: "Wadi", color: CAT_COLOR["Wadi"] },
    { key: "Large Park", color: CAT_COLOR["Large Park"] },
  ];
  document.getElementById("tabs").innerHTML = tabDefs.map(t =>
    `<button class="tab ${t.key === activeTab ? 'active' : ''}" data-key="${t.key}" onclick="setTab('${t.key}')">
      <span class="swatch" style="background:${t.color}"></span>${t.key === "All" ? "All" : t.key + "s"}
    </button>`
  ).join("");
}

function setTab(key) {
  activeTab = key;
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.key === key));
  render();
}

function barRow(label, value, cls, refMax) {
  const width = refMax > 0 ? Math.min(100, (Number(value) || 0) / refMax * 100) : 0;
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-track">
      <div class="bar-fill ${cls}" style="width:${width}%"></div>
    </div>
    <div class="bar-val">${pct(value)}</div>
  </div>`;
}

function card(item) {
  const refMax = Number(item.futureKPI) || Math.max(Number(item.matureKPI) || 0, 1);
  return `<div class="card">
    <div class="name">${item.name}</div>
    <div class="meta">${item.area ? "<b>" + fmt(item.area) + " m²</b> Project area<br>" : ""}<b>${fmt(item.currentTrees)}</b> current trees<br><b>${fmt(item.totalTrees)}</b> potential trees</div>
    <div class="bars">
      ${barRow("Current Canopy", item.currentKPI, "current", refMax)}
      ${barRow("Mature Canopy", item.matureKPI, "mature", refMax)}
      ${barRow("Potential Canopy", item.futureKPI, "future", refMax)}
    </div>
    <div class="footnote"><span>Planned target</span><span class="footnote-val">${pct(item.plannedKPI)}</span></div>
  </div>`;
}

function sectionHTML(catKey) {
  const items = DATA[catKey];
  if (!items || !items.length) return "";
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = q ? items.filter(i => i.name.toLowerCase().includes(q)) : items;
  if (!filtered.length) return "";
  const agg = aggregate(items);
  return `<section class="category">
    <div class="cat-header">
      <span class="cat-badge" style="background:${CAT_COLOR[catKey]}"></span>
      <h2>${CAT_ICON[catKey]} ${catKey}s</h2>
      <span class="count">${items.length} project${items.length === 1 ? "" : "s"}</span>
      <span class="cat-summary">
        <span class="cat-summary-line">${fmt(agg.currentTrees)} current trees</span>
        <span class="cat-summary-line">${fmt(agg.totalTrees)} potential trees</span>
      </span>
    </div>
    <div class="card-grid">${filtered.map(card).join("")}</div>
  </section>`;
}

function comingSoonHTML() {
  const n = DATA.Neighbourhood.length;
  if (!n) return "";
  return `<section class="category">
    <div class="coming-soon">
      <div class="num">${n}</div>
      <div class="txt"><b>Neighbourhoods</b> identified for the next phase — canopy figures haven't been captured yet. This section will populate automatically once that data lands in the sheet.</div>
    </div>
  </section>`;
}

function render() {
  const order = activeTab === "All" ? ["Road", "Wadi", "Large Park"] : [activeTab];
  let html = order.map(sectionHTML).join("");
  if (activeTab === "All") html += comingSoonHTML();
  document.getElementById("sections").innerHTML = html || `<div style="padding:60px 0; text-align:center; color:var(--text-muted);">No projects match your search.</div>`;
}

// Same mechanism as KPI_Report_Template.html's PDF export: html2canvas + jsPDF,
// a small popup window with its own progress bar (a real top-level window, so a
// download link clicked there triggers an actual save-to-disk even if this page
// is ever embedded in a sandboxed iframe), and a data-URI download so there's no
// blob to fail across that window boundary. This page is one continuous flow
// (not fixed 1280x720 slides), so the whole .wrap is captured as a single tall
// page instead of one-slide-per-page.
async function downloadOverviewPDF() {
  var pdfWinW = 150, pdfWinH = 150;
  var pdfWinLeft = Math.max(0, window.screen.width - pdfWinW - 20);
  var pdfWindow = window.open('', 'pdfDownloadWindowOverview', 'width=' + pdfWinW + ',height=' + pdfWinH + ',left=' + pdfWinLeft + ',top=80');
  if (pdfWindow) {
    pdfWindow.document.write(
      '<html><head><style>' +
      'body{font-family:"Segoe UI",Poppins,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#fff;padding:6px;box-sizing:border-box;text-align:center}' +
      '.title{font-size:10px;color:#222;margin-bottom:10px;line-height:1.3}' +
      '.bar-wrap{width:90%;height:9px;background:#e6e6e6;border-radius:5px;overflow:hidden}' +
      '.bar{height:100%;width:0%;background:linear-gradient(90deg,#38A800,#1D753B);border-radius:5px;transition:width .25s linear}' +
      '.pct{margin-top:7px;font-size:11px;font-weight:700;color:#1D753B}' +
      '.done{display:none;font-size:11px;color:#1D753B;font-weight:700;margin-top:8px;line-height:1.3}' +
      '.fallback{margin-top:8px;font-size:8px;color:#888}' +
      '</style></head><body>' +
      '<div class="title" id="titleMsg">Preparing your PDF…</div>' +
      '<div class="bar-wrap"><div class="bar" id="bar"></div></div>' +
      '<div class="pct" id="pct">0%</div>' +
      '<div class="done" id="done">&#10003; Done!</div>' +
      '<div class="fallback">Didn\'t start? <a id="manualDl" href="#">click here</a>.</div>' +
      '</body></html>'
    );
    pdfWindow.document.close();
  }
  window.focus();
  setTimeout(function() { window.focus(); }, 50);
  setTimeout(function() { window.focus(); }, 300);

  var btn = document.getElementById('downloadBtn');
  var statusTextEl = document.getElementById('statusText');
  var prevStatus = statusTextEl ? statusTextEl.textContent : '';
  if (btn) { btn.disabled = true; btn.style.opacity = '.55'; btn.style.cursor = 'default'; }
  if (statusTextEl) statusTextEl.textContent = 'Preparing PDF…';
  function setPct(p) {
    if (pdfWindow && !pdfWindow.closed) {
      var barEl = pdfWindow.document.getElementById('bar');
      var pctEl = pdfWindow.document.getElementById('pct');
      if (barEl) barEl.style.width = p + '%';
      if (pctEl) pctEl.textContent = p + '%';
    }
  }
  setPct(10);
  await new Promise(function(r) { setTimeout(r, 200); });

  try {
    var target = document.querySelector('.wrap');
    var canvas = await html2canvas(target, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff' });
    setPct(70);

    var jsPDF = window.jspdf.jsPDF;
    var pageW = 1000;
    var pageH = canvas.height * (pageW / canvas.width);
    var pdf = new jsPDF({ orientation: pageH > pageW ? 'portrait' : 'landscape', unit: 'px', format: [pageW, pageH] });
    var img = canvas.toDataURL('image/jpeg', 0.92);
    pdf.addImage(img, 'JPEG', 0, 0, pageW, pageH);
    setPct(95);

    var fileName = 'Canopy_Overview_' + new Date().toISOString().slice(0, 10) + '.pdf';
    var dataUri = pdf.output('datauristring');

    if (pdfWindow && !pdfWindow.closed) {
      var titleEl = pdfWindow.document.getElementById('titleMsg');
      var pctEl2 = pdfWindow.document.getElementById('pct');
      var doneEl = pdfWindow.document.getElementById('done');
      var dlEl = pdfWindow.document.getElementById('manualDl');
      if (titleEl) titleEl.innerHTML = 'Downloading <b>' + fileName + '</b>';
      setPct(100);
      if (pctEl2) pctEl2.style.display = 'none';
      if (doneEl) doneEl.style.display = 'block';
      if (dlEl) { dlEl.href = dataUri; dlEl.download = fileName; dlEl.click(); }
      setTimeout(function() { if (!pdfWindow.closed) pdfWindow.close(); window.focus(); }, 500);
    } else {
      var a = document.createElement('a');
      a.href = dataUri; a.download = fileName; a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(function() { document.body.removeChild(a); }, 1000);
    }
  } catch (err) {
    console.error('PDF generation failed:', err);
    if (pdfWindow && !pdfWindow.closed) pdfWindow.close();
    alert('Could not generate the PDF: ' + err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = 'pointer'; }
    if (statusTextEl) statusTextEl.textContent = prevStatus;
  }
}

loadData();
</script>
</body>
</html>
